<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>namesniper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F232B; --side:#1A1D24; --surface:#272C35; --raised:#313744; --line:#3B4250; --line-soft:#30353F; --pit:#14161B;
  --text:#EEE9DD; --muted:#959CA9; --faint:#6E7581;
  --gold:#E5B53E; --gold-ink:#231B05; --diamond:#62C8C2; --green:#74C27A; --xp:#86CF4E; --red:#E0624F;
  --pix:'Silkscreen', ui-monospace, monospace;
  --body:'Atkinson Hyperlegible', system-ui, sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--gold)}
.px{font-family:var(--pix);letter-spacing:.03em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 16px 18px 22px;font-family:var(--pix);font-size:19px}
.brand i{width:10px;height:10px;background:var(--faint);display:block;flex:none}
.brand i.live{background:var(--xp);box-shadow:0 0 0 3px rgba(134,207,78,.18)}
.brand .seg{margin-left:auto;display:none}
nav{display:flex;flex-direction:column;padding:0 12px;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:var(--r);color:var(--muted);text-decoration:none}
nav a:hover{color:var(--text);background:var(--surface)}
nav a.on{color:var(--text);background:var(--raised);box-shadow:inset 3px 0 0 var(--gold)}
nav a b{font-weight:400;font-size:12.5px;min-width:22px;text-align:center;padding:0 7px;border-radius:20px;background:var(--line-soft);color:var(--muted)}
nav a b.warn{background:var(--gold);color:var(--gold-ink)}
.sys{margin-top:auto;padding:18px 22px 22px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.sys .row{display:flex;justify-content:space-between;gap:8px}
.sys .row span:last-child{color:var(--text)}

main{padding:32px 40px 64px;max-width:1280px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.page-head h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700}
.page-head p{margin:0;color:var(--muted);max-width:62ch}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:16px;margin:0}
.block{margin-top:36px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.block-head a{font-size:14px;text-decoration:none}
.block-head a:hover{text-decoration:underline}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line-soft)}
  .brand{padding:14px 16px 10px 18px}
  .brand .seg{display:inline-flex}
  nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px}
  nav a{white-space:nowrap}
  nav a.on{box-shadow:inset 0 -2px 0 var(--gold)}
  .sys{display:none}
  main{padding:24px 16px 48px}
}

/* ---------- controls ---------- */
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--gold);border-color:#B98E25;color:var(--gold-ink);font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.2)}
.btn.small{padding:3px 10px;font-size:13.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;width:100%}
select.compact{padding:3px 8px;font-size:13.5px;width:auto;max-width:180px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
label.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
label.chk input{width:auto;margin-top:4px;accent-color:var(--gold)}
label.chk > span{color:var(--muted);font-size:14px}
label.chk b{display:block;font-weight:400;color:var(--text)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.c-gold{color:var(--gold)} .c-dia{color:var(--diamond)} .c-green{color:var(--green)} .c-red{color:var(--red)} .c-muted{color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--raised);color:var(--text)}
.seg.tiny button{font:12.5px/1.4 var(--body);padding:2px 8px}

/* XP bar: segmented progress, like in the game */
.xp{position:relative;height:10px;background:var(--pit);border:1px solid var(--pit);border-radius:2px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--xp);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.18)}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),var(--pit) calc(5% - 2px) 5%)}
.xp.thin{height:7px}

/* ---------- overview hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:20px}
@media (max-width:1050px){.hero{grid-template-columns:1fr}}
.next{position:relative;isolation:isolate;overflow:hidden;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:22px 28px 22px;display:flex;flex-direction:column;min-height:260px}
.next::before{content:"";position:absolute;inset:0 0 0 42%;z-index:-1;background:repeating-conic-gradient(#2D323C 0 25%,transparent 0 50%) 0 0/24px 24px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 75%);mask-image:linear-gradient(90deg,transparent,#000 75%)}
.next .top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.next .name{font-family:var(--pix);font-size:clamp(52px,8vw,96px);line-height:1;letter-spacing:.04em;word-break:break-all;text-shadow:.07em .07em 0 rgba(0,0,0,.5);margin:10px 0 14px}
.next .when{color:var(--muted);font-size:14px;margin-bottom:2px}
.clock{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--pix);font-size:13px;color:var(--muted)}
.clock b{font-size:32px;line-height:1.1;font-weight:400;color:var(--text);margin-right:3px}
.next .xp{margin-top:14px}
.xp-cap{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--faint);margin-top:6px}
.next .meta{display:flex;flex-wrap:wrap;gap:6px 24px;color:var(--muted);font-size:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.next .meta b{font-weight:400;color:var(--text)}
.next.empty{justify-content:center;gap:14px}
.next.empty .name{color:var(--faint);text-shadow:none;margin:0}
.next.empty p{margin:0;color:var(--muted);max-width:46ch}

.ready{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:22px 24px}
.ready h2{margin-bottom:16px}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ready li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.ready .dot{width:10px;height:10px;margin-top:6px}
.ready .ok .dot{background:var(--green)} .ready .todo .dot{background:var(--gold)} .ready .bad .dot{background:var(--red)}
.ready li b{display:block;font-weight:400}
.ready li span{color:var(--muted);font-size:14px}

.tokenbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border-radius:var(--r);background:rgba(0,0,0,.18);font-size:14px;color:var(--muted)}
.tokenbox span:nth-child(2){flex:1;min-width:220px}
.tokenbox b{color:var(--text);font-weight:400}
.tokenbox.act{color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:36px}
@media (max-width:1050px){.split{grid-template-columns:1fr}}

/* ---------- drop timeline ---------- */
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;border-radius:2px;background:var(--gold)}
.legend i.q{background:var(--diamond)}
.legend i.now{width:2px;height:12px;background:var(--red)}
.legend i.x{background:var(--red);opacity:.9}
.tl{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:6px 18px 4px}
.tl-row{display:grid;grid-template-columns:92px minmax(0,1fr) 128px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.tl-row:last-child{border-bottom:0}
.tl-row .n{font-family:var(--pix);font-size:18px;line-height:1.1;min-width:0}
.tl-row .n small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-track{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--line-soft) 0 1px,transparent 1px var(--day))}
.tl-bar{position:absolute;top:8px;height:10px;min-width:8px;border:0;padding:0;border-radius:2px;background:var(--gold);box-shadow:inset 0 2px 0 rgba(255,255,255,.25);cursor:pointer;display:block}
.tl-bar::before{content:"";position:absolute;inset:-8px -4px}
.tl-bar:hover{filter:brightness(1.18)}
.tl-bar.q{background:var(--diamond)}
.tl-bar.x{background:var(--red)}
.tl-row .n .st{color:var(--gold);font-family:var(--body);margin-right:3px}
.tl-now{position:absolute;top:-9px;bottom:-9px;width:2px;margin-left:-1px;background:var(--red);opacity:.85}
.tl-act{text-align:right}
.tl-axis{padding:8px 0 6px;border-bottom:1px solid var(--line)}
.tl-axis .tl-track{height:18px;background:none}
.tl-axis span{position:absolute;top:0;font-size:12.5px;color:var(--faint);white-space:nowrap;padding-left:5px;border-left:1px solid var(--line)}
.tl-more{padding:10px 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line-soft)}
@media (max-width:640px){
  .tl{padding:4px 12px}
  .tl-row{grid-template-columns:66px minmax(0,1fr) 58px;gap:10px}
  .tl-act .pill{font-size:0;gap:0}
  .tl-row .n{font-size:15px}
  .tl-axis span{font-size:11px}
}

/* ---------- lists & tables ---------- */
.list{border-top:1px solid var(--line-soft)}
.li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line-soft)}
.li .n{font-family:var(--pix);font-size:19px}
.li .d{font-size:14px;color:var(--muted);min-width:0}
.li .d b{font-weight:400;color:var(--text)}
.empty-note{padding:22px 0;color:var(--muted);border-top:1px solid var(--line-soft)}
.empty-note b{display:block;font-weight:400;color:var(--text);margin-bottom:2px}
.tl .empty-note{border-top:0;padding:18px 0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:400;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.015)}
td.n{font-family:var(--pix);font-size:17px;white-space:nowrap}
td.n .sub{font-family:var(--body);letter-spacing:0;font-size:13px}
.as{font-family:var(--body);font-weight:700;letter-spacing:.04em}
td.acts{text-align:right;white-space:nowrap}
td.acts .btn+.btn{margin-left:6px}
td .sub{display:block;color:var(--muted);font-size:13px}
td .sub.c-red{color:var(--red)} td .sub.c-green{color:var(--green)} td .sub.c-gold{color:var(--gold)}
.tokenbox.warn{box-shadow:inset 3px 0 0 var(--gold)}
.tokenbox .btns{display:flex;gap:6px;flex-wrap:wrap}
.calib{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.calib span{flex:1;min-width:240px}
#accounts td.acts{white-space:normal;min-width:200px}
#accounts td.acts .btn{margin:2px 0 2px 4px}
#accounts td.acts .btn+.btn{margin-left:4px}
#accounts td .sub{white-space:nowrap}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{width:220px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:14px;color:var(--muted)}

.star{background:none;border:0;cursor:pointer;color:var(--faint);font-size:15px;padding:0 6px 0 0;line-height:1;vertical-align:1px}
.star:hover{color:var(--text)}
.star.on{color:var(--gold)}
.att-row td{background:rgba(0,0,0,.16);padding:8px 14px 12px}
table.att{width:auto;font-size:13.5px}
table.att th,table.att td{padding:3px 18px 3px 0;border:0;background:none!important}
table.att td.body{color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-row .hint{margin:8px 0 0;font-size:13px;color:var(--muted)}

/* ---------- accounts ---------- */
.help{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--diamond);border-radius:var(--r);padding:14px 18px;margin-bottom:22px;font-size:14.5px;color:var(--muted)}
.help b{color:var(--text);font-weight:400}
.help ol{margin:6px 0 0;padding-left:20px}

/* ---------- settings ---------- */
.settings{display:flex;flex-direction:column;gap:22px;max-width:760px}
fieldset{border:1px solid var(--line-soft);border-radius:10px;background:var(--surface);padding:20px 22px 22px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
legend{padding:0 6px;font-weight:700}
fieldset .full{grid-column:1/-1}
fieldset .hint{grid-column:1/-1;margin:-4px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:640px){fieldset{grid-template-columns:1fr}}
.save-bar{display:flex;gap:10px;align-items:center}

/* ---------- log ---------- */
.log{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 16px;font-size:14px;overflow:auto}
#log-full{height:calc(100vh - 220px);min-height:320px}
.log div{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:3px 0 3px 10px;border-left:2px solid transparent}
.log time{color:var(--faint)}
.log .ok{border-left-color:var(--green)} .log .ok span{color:var(--green)}
.log .warn{border-left-color:var(--gold)} .log .warn span{color:var(--gold)}
.log .error{border-left-color:var(--red)} .log .error span{color:var(--red)}
.log.mini div{grid-template-columns:70px 1fr}
@media (max-width:640px){.log div{grid-template-columns:1fr;gap:0}}

.mode-seg{margin:0 0 16px}
.code-box{font-family:var(--pix);font-size:34px;letter-spacing:.12em;text-align:center;background:var(--bg);border:1px dashed var(--line);border-radius:var(--r);padding:14px 10px;cursor:copy;user-select:all}
#msa-box p{margin:8px 0 0;font-size:14px}
#msa-box ol{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.sys .bad{color:var(--red)!important}
.sys .row > button{background:none;border:0;color:var(--gold);cursor:pointer;padding:0;font-size:13px}
fieldset ol{margin:4px 0 0;padding-left:20px}
.kinds{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-soft);padding-top:16px}
.kinds > b{font-weight:400;color:var(--text)}

/* ---------- dialog ---------- */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:min(540px,94vw)}
dialog::backdrop{background:rgba(12,14,18,.65)}
dialog h2{font-size:19px;margin-bottom:4px}
dialog .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form .hint{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:-6px 0 0}
.window-box{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:22px}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,8px);background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<aside>
  <div class="brand"><i id="live"></i><span>namesniper</span></div>
  <nav id="nav">
    <a href="#overview"><span data-i18n="nav_overview">Overview</span></a>
    <a href="#snipes"><span data-i18n="nav_snipes">Snipes</span> <b id="nb-snipes">0</b></a>
    <a href="#names"><span data-i18n="nav_names">Names</span> <b id="nb-drops">0</b></a>
    <a href="#accounts"><span data-i18n="nav_accounts">Accounts</span> <b id="nb-acc">0</b></a>
    <a href="#log"><span data-i18n="nav_log">Log</span></a>
    <a href="#settings"><span data-i18n="nav_settings">Settings</span></a>
  </nav>
  <div class="sys">
    <div class="row"><span data-i18n="sys_scanner">Scanner</span><span id="sys-scan"></span></div>
    <div class="xp thin"><i id="sys-meter"></i></div>
    <div class="row" id="sys-fast-row" hidden><span data-i18n="sys_fast"></span><span class="num" id="sys-fast"></span></div>
    <div class="row" id="sys-eta-row" hidden><span data-i18n="sys_eta"></span><span class="num" id="sys-eta"></span></div>
    <div class="row"><span data-i18n="sys_names">Names tracked</span><span class="num" id="sys-names">0</span></div>
    <div class="row"><span data-i18n="sys_ntp">Clock offset</span><span class="num" id="sys-ntp">0 ms</span></div>
    <div class="row" id="sys-ntp-bad" hidden><span class="bad" data-i18n="ntp_unsynced"></span><button type="button" data-ntp data-i18n="ntp_resync"></button></div>
  </div>
</aside>

<main>

<!-- OVERVIEW -->
<section data-page="overview">
  <div class="page-head">
    <div><h1 data-i18n="nav_overview">Overview</h1><p data-i18n="ov_lead"></p></div>
    <div class="acts"><button class="btn primary" data-new-snipe data-i18n="new_snipe">New snipe</button></div>
  </div>

  <div class="hero">
    <div class="next" id="next"></div>
    <div class="ready"><h2 data-i18n="ready_title"></h2><ul id="ready"></ul></div>
  </div>

  <div class="block">
    <div class="block-head">
      <h2 data-i18n="ov_drops"></h2>
      <div class="legend"><span><i class="now"></i><span data-i18n="lg_now"></span></span><span><i></i><span data-i18n="lg_window"></span></span><span><i class="q"></i><span data-i18n="lg_planned"></span></span><span><i class="x"></i><span data-i18n="lg_conflict"></span></span></div>
      <a href="#names" data-filter="released" data-i18n="ov_all_drops"></a>
    </div>
    <div id="ov-drops"></div>
  </div>

  <div class="split block">
    <div>

function tr(key, vars={}){
  const s = STR[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}
const loc = () => 'en-GB';

function applyI18n(){
  $$('[data-i18n]').forEach(el => el.textContent = tr(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = tr(el.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(el => el.placeholder = tr(el.dataset.i18nPh));

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, skew = 0;
const now = () => (Date.now() + skew) / 1000;
const fmtN = n => Number(n||0).toLocaleString(loc());

function fmt(ts){ return new Date(ts*1000).toLocaleString(loc(),{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function fmtShort(ts){ return new Date(ts*1000).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function parts(sec){ sec = Math.max(0, Math.floor(sec)); return {d:Math.floor(sec/86400), h:Math.floor(sec%86400/3600), m:Math.floor(sec%3600/60), s:sec%60}; }
function span(sec){
  const {d,h,m,s} = parts(Math.abs(sec)), H = tr('u_h');
  return d ? `${d}d ${h}${H}` : h ? `${h}${H} ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
function dur(sec){ return tr(sec < 0 ? 'ago' : 'in', {t: span(sec)}); }
function clockHTML(sec){
  const {d,h,m,s} = parts(sec), pad = v => String(v).padStart(2,'0');
  const seg = (d ? [[d,'d']] : []).concat([[h,tr('u_h')],[m,'m'],[s,'s']]);
  return seg.map(([v,u]) => `<span><b>${pad(v)}</b>${u}</span>`).join('');
}
function toast(msg, err=false){
  const t=$('#toast'); t.textContent=msg; t.className = err ? 'show err' : 'show';
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',3500);
}
async function api(path, opts={}){
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  let data = null; try { data = await r.json(); } catch {}
  if(!r.ok){ const m = data?.detail || tr('e_http',{s:r.status}); toast(typeof m === 'string' ? m : tr('e_invalid'), true); throw new Error(m); }
  return data;
}

/* ---------- routing ---------- */
const PAGES = ['overview','snipes','names','accounts','log','settings'];
function route(){
  const p = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  $$('[data-page]').forEach(s => s.hidden = s.dataset.page !== p);
  $$('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#'+p));
  if (p === 'names') loadNames();
  if (p === 'settings') fillSettings();
  if (p === 'log') { const l=$('#log-full'); l.scrollTop = l.scrollHeight; }
}
window.addEventListener('hashchange', route);

async function refresh(){
  try{
    S = await api('/api/state');
    skew = S.now*1000 - Date.now();
    $('#live').classList.add('live');
    render();
  }catch{ $('#live').classList.remove('live'); }
}

const T_STATUS = {queued:['s_queued','c-muted'], armed:['s_armed','c-dia'], won:['s_won','c-green'], lost:['s_lost','c-red'], missed:['s_missed','c-muted'], cancelled:['s_cancelled','c-muted'], error:['s_error','c-red']};
const tStatus = s => T_STATUS[s] ? [tr(T_STATUS[s][0]), T_STATUS[s][1]] : [s, 'c-muted'];
const live = t => t.status==='queued' || t.status==='armed';
const usable = a => a.can_claim && !a.busy && (!a.exp || a.exp > now()+300);
const accLabel = id => S.accounts.find(a=>a.id===id)?.label;
// account status arrives as a code from the backend (ready, cooldown, expired, unknown, error: ...)
function accStatus(s){
  const k = {ready:'st_ready', cooldown:'st_cooldown', expired:'st_expired', unknown:'st_unknown'}[s];
  if (k) return tr(k);
  if (String(s).startsWith('error:')) return tr('st_err') + String(s).slice(6);
  return s;
}

function accountOptions(selected){
  const opts = [`<option value="">${tr('acc_auto_opt')}</option>`];
  for (const a of S.accounts){
    const note = !a.can_claim ? ` (${accStatus(a.status)})` : a.exp && a.exp < now() ? tr('note_expired') : a.has_profile===0 ? tr('note_noprof') : '';
    opts.push(`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.label)}${esc(note)}</option>`);
  }
  return opts.join('');
}

/* token plan: when to renew so the token covers the whole window */
function tokenInfo(t){
  const p = t.token; if (!p) return null;
  if (!p.label) return {cls:'c-red', short:tr('tk_noacc'), long:tr('tk_noacc_l'), act:false};
  const label = esc(p.label);
  if (p.auto) return {cls:'c-green', short:tr('tk_auto'), long:tr('tk_auto_l',{label}), act:false};
  if (p.ok) return {cls:'c-green', short:tr('tk_ok'), long:tr('tk_ok_l',{label, exp:fmt(p.exp)}), act:false};
  const n = now();
  if (!p.fits) return {cls:'c-gold', short:tr('tk_long'), long:tr('tk_long_l',{label, start:fmt(t.window_start)}), act:true, pid:p.account_id};
  if (n < p.earliest) return {cls:'c-muted', short:tr('tk_from',{at:fmtShort(p.earliest)}), long:tr('tk_from_l',{label, a:fmt(p.earliest), b:fmt(p.latest)}), act:false, pid:p.account_id};
  if (n <= p.latest) return {cls:'c-gold', short:tr('tk_now',{at:fmtShort(p.latest)}), long:tr('tk_now_l',{label, at:fmt(p.latest)}), act:true, pid:p.account_id};
  return {cls:'c-red', short:tr('tk_late'), long:tr('tk_late_l',{label}), act:true, pid:p.account_id};
}

function scanEta(){
  const sc = S.scan;
  if (!sc.running || !sc.pos || !sc.started_at) return null;
  const el = now() - S.ntp - sc.started_at;
  return el / sc.pos * (sc.total - sc.pos);
}

/* conflicts: more windows open at once than there are accounts available */
function conflicts(){
  const out = new Set();
  const liveT = S.targets.filter(live);
  const pinnedIds = new Set(liveT.filter(t => t.pinned).map(t => t.pinned));
  const pool = S.accounts.filter(a => a.can_claim && !a.locked && !pinnedIds.has(a.id)).length;
  const auto = liveT.filter(t => !t.pinned);
  const ev = [];
  auto.forEach(t => { ev.push([t.window_start, 1, t]); ev.push([t.window_end, -1, t]); });
  ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const active = new Set();
  for (const [, d, t] of ev){
    if (d > 0){ active.add(t); if (active.size > pool) active.forEach(x => out.add(x.id)); }
    else active.delete(t);
  }
  const byAcc = {};
  liveT.filter(t => t.pinned).forEach(t => (byAcc[t.pinned] ||= []).push(t));
  Object.values(byAcc).forEach(ts => ts.forEach((a, i) => ts.slice(i+1).forEach(b => {
    if (a.window_start < b.window_end && b.window_start < a.window_end){ out.add(a.id); out.add(b.id); }
  })));
  return out;
}

let CONF = new Set(), nextAt = null, nextName = null;
const WIDE = 60;  // warn from this many seconds of uncertainty
/* uncertainty about the drop time, in seconds (null = no estimate, e.g. watch from now) */
function unc(t){
  if (t.mode === 'drop') return t.drop_end ? t.drop_end - t.drop_at : 0;
  return t.n_lo != null && t.n_hi != null ? t.n_hi - t.n_lo : null;
}
const nameMC = n => `https://namemc.com/search?q=${encodeURIComponent(n)}`;
const sgn = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}s`;
function render(){
  const c = S.counts, sc = S.scan;
  CONF = conflicts();
  const waitS = sc.wait_until ? Math.max(0, Math.round(sc.wait_until - Date.now()/1000)) : 0;
  $('#sys-scan').textContent = waitS ? tr('scan_wait',{s:waitS}) : sc.running ? tr('scan_round',{n:sc.round+1}) : tr('scan_off');
  $('#sys-meter').style.width = sc.running ? `${(sc.pos/Math.max(sc.total,1)*100).toFixed(1)}%` : '0';
  const eta = scanEta();
  $('#sys-eta-row').hidden = eta === null;
  if (eta !== null) $('#sys-eta').textContent = dur(eta);
  $('#sys-names').textContent = fmtN((c.taken||0)+(c.free||0)+(c.released||0));
  const ntpOk = S.ntp_info.ok;
  $('#sys-ntp').textContent = `${S.ntp>=0?'+':''}${(S.ntp*1000).toFixed(1)} ms`;
  $('#sys-ntp').title = S.ntp_info.server || '';
  $('#sys-ntp-bad').hidden = ntpOk;
  $('#nm-round').textContent = sc.last_secs ? tr('nm_round',{t:span(sc.last_secs)}) : '';
  $('#sys-fast-row').hidden = !S.fast.running;
  $('#sys-fast').textContent = tr('sys_fast_v',{n:S.fast.count, s:S.settings.fast_interval});
  const cb = S.calib;
  $('#calib-info').textContent = cb.n
    ? tr('calib_info',{n:`${cb.n} ${tr(cb.n===1?'w_name1':'w_names')}`, avg:sgn(cb.avg), min:sgn(cb.min), max:sgn(cb.max)})
    : tr('calib_none_ui');
  $('#calib-apply').hidden = !cb.n;

  const liveT = S.targets.filter(live);
  const ready = S.accounts.filter(usable);
  $('#nb-snipes').textContent = liveT.length;
  $('#nb-snipes').classList.toggle('warn', CONF.size > 0);
  $('#nb-drops').textContent = S.upcoming.length;
  const nbAcc = $('#nb-acc'); nbAcc.textContent = S.accounts.length;
  nbAcc.classList.toggle('warn', (liveT.length > 0 && ready.length === 0) || S.accounts.some(a => a.relink));

  renderNext(liveT);
  renderReady(liveT, ready);
  renderDrops();
  renderSnipes(liveT);
  renderAccounts();
  tick();
}

function tokenBox(t){
  const ti = tokenInfo(t); if (!ti) return '';
  return `<div class="tokenbox ${ti.act?'act':''}"><span class="pill ${ti.cls}">Token</span><span>${ti.long}</span>${ti.pid && !t.token?.auto?`<button class="btn small ${ti.act?'primary':''}" data-token="${ti.pid}">${tr('renew_token')}</button>`:''}</div>`;
}

function wideBox(t){
  const u = unc(t);
  if (u == null || u <= WIDE) return '';
  return `<div class="tokenbox act warn"><span class="pill c-gold">${tr('wide_title',{u:span(u)})}</span><span>${tr('wide_l',{u:span(u)})}</span>
    <span class="btns"><a class="btn small" href="${nameMC(t.name)}" target="_blank" rel="noopener">${tr('wide_namemc')}</a><button class="btn small primary" data-import>${tr('wide_import')}</button></span></div>`;
}

function renderNext(liveT){
  const t = liveT[0], el = $('#next');
  if (!t){
    nextAt = nextName = null;
    el.className = 'next empty';
    el.innerHTML = `<div class="top"><span>${tr('next')}</span></div>
      <div class="name">${tr('next_empty_t')}</div>
      <p>${tr('next_empty')}</p>
      <div><button class="btn primary" data-new-snipe>${tr('new_snipe')}</button></div>`;
    return;
  }
  el.className = 'next';
  const armed = t.status==='armed', drop = t.mode==='drop';
  let whenKey, at, from;
  if (armed && !drop) { whenKey='w_watching'; at=t.window_end; from=t.window_start; }
  else if (drop) { whenKey = armed ? 'w_fires' : 'w_drop'; at=t.drop_at; from=t.created; }
  else { whenKey='w_start'; at=t.window_start; from=t.created; }
  nextAt = at; nextName = t.name;
  const acc = armed ? esc(t.account) : t.pinned_label ? tr('pinned_acc',{label:esc(t.pinned_label)}) : tr('automatic');
  const [st, cls] = tStatus(t.status);
  el.innerHTML = `
    <div class="top"><span>${tr('next')}</span><span>${CONF.has(t.id) ? `<span class="pill c-red">${tr('conflict_short')}</span>&nbsp;&nbsp;` : ''}<span class="pill ${cls}">${st}</span></span></div>
    <div class="name">${esc(t.name)}</div>
    <div class="when">${tr(whenKey)}</div>
    <div class="clock num" data-clock="${at}"></div>
    <div class="xp"><i data-xp="${from},${at}"></i></div>
    <div class="xp-cap num"><span>${tr(armed&&!drop?'cap_window':'cap_planned',{at:fmtShort(from)})}</span><span>${fmt(at)}</span></div>
    <div class="meta num">
      <span>${tr('method')} <b>${drop?tr('m_exact'):tr('m_watch')}</b></span>
      <span>${drop?tr('moment'):tr('window')} <b>${drop?fmt(t.drop_at):`${fmtShort(t.window_start)} – ${fmtShort(t.window_end)}`}</b></span>
      <span>${tr('claims_as_m')} <b class="as">${esc(t.claim_as || t.name)}</b></span>
      ${t.drop_end ? `<span>${tr('spread')} <b>${span(t.drop_end - t.drop_at)}</b></span>` : ''}
      <span>${tr('account')} <b>${acc}</b></span>
    </div>
    ${wideBox(t)}
    ${tokenBox(t)}`;
}

function renderReady(liveT, ready){
  const items = [];
  const sc = S.scan;
  if (S.settings.scan_enabled) {
    const eta = scanEta();
    let d = !sc.running ? tr('r_scan_soon')
      : eta !== null ? tr('r_scan_eta',{n:sc.round+1, p:Math.round(sc.pos/Math.max(sc.total,1)*100), t:dur(eta)})
      : tr('r_scan_prog',{n:sc.round+1, p:0});
    if (sc.last_secs) d += tr('r_scan_last',{t:span(sc.last_secs)});
    items.push(['ok', tr('r_scan_on'), d]);
  } else items.push(['todo', tr('r_scan_off'), tr('r_scan_off_d')]);

  if (S.fast.running) items.push(['ok', tr('r_fast'), tr('r_fast_d',{n:S.fast.count, s:S.settings.fast_interval})]);
  else if (S.starred && !S.settings.fast_enabled) items.push(['todo', tr('r_fast_off'), tr('r_fast_off_d')]);

  if (!S.ntp_info.ok) items.push(['bad', tr('r_ntp_bad'), tr('r_ntp_bad_d')]);
  else if (liveT.some(t => t.mode === 'drop')) items.push(['ok', tr('r_ntp_ok'), tr('r_ntp_ok_d',{ms:`${S.ntp>=0?'+':''}${(S.ntp*1000).toFixed(1)} ms`, server:esc(S.ntp_info.server)})]);

  if (!S.accounts.length) items.push(['bad', tr('r_noacc'), tr('r_noacc_d')]);
  else if (!ready.length) items.push(['bad', tr('r_nouse'), tr('r_nouse_d')]);
  else {
    const np = ready.filter(a=>a.has_profile===0).length;
    items.push(['ok', tr('r_acc_ok',{r:ready.length, n:S.accounts.length}), np ? tr('r_noprof',{n:np}) : tr('r_allprof')]);
  }

  const plural = n => `${n} ${n===1?'snipe':'snipes'}`;
  const claimable = S.accounts.filter(a => a.can_claim).length;
  if (CONF.size) items.push(['bad', tr('r_conflict',{n:plural(CONF.size)}), tr('r_conflict_d')]);
  else if (claimable && liveT.length > claimable) items.push(['todo', tr('r_soft'), tr('r_soft_d',{a:claimable, n:liveT.length})]);

  const needs = liveT.map(t => [t, tokenInfo(t)]).filter(([, ti]) => ti && ti.act);
  if (needs.length) {
    const [t, ti] = needs[0];
    items.push(['bad', tr('r_renew',{name:esc(t.name)}), `${ti.short}. <a href="#" data-token="${ti.pid}">${tr('r_renew_now')}</a>${needs.length>1?tr('r_more',{n:needs.length-1}):''}`]);
  } else if (liveT.some(t => t.token && !t.token.ok)) {
    const t = liveT.find(t => t.token && !t.token.ok), ti = tokenInfo(t);
    items.push(['todo', tr('r_later',{name:esc(t.name)}), ti.short]);
  } else if (liveT.length) items.push(['ok', tr('r_tok_ok'), tr('r_nothing')]);

  const auto = liveT.filter(t=>!t.pinned).length, pinned = liveT.length - auto;
  if (liveT.length) items.push([ready.length ? 'ok' : 'todo', tr('r_planned',{n:plural(liveT.length)}), tr('r_planned_d',{p:pinned, a:auto})]);
  else items.push(['todo', tr('r_none'), tr('r_none_d')]);

  $('#ready').innerHTML = items.map(([k,b,s]) => `<li class="${k}"><i class="dot"></i><div><b>${b}</b><span>${s}</span></div></li>`).join('');
}

/* drop timeline: each window as a bar on a day axis, starting today */
function renderDrops(){
  const el = $('#ov-drops'), n = now(), DAY = 86400;
  const byName = new Map(S.targets.filter(live).map(t => [t.name, t]));
  const all = S.upcoming.filter(u => u.drop_hi > n);
  if (!all.length){
    el.innerHTML = `<div class="tl"><div class="empty-note"><b>${tr('dr_empty')}</b>${S.settings.scan_enabled ? tr('dr_empty_on') : tr('dr_empty_off')}</div></div>`;
    return;
  }
  const d0 = new Date(n*1000); d0.setHours(0,0,0,0);
  const t0 = d0.getTime()/1000;
  let days = Math.ceil((Math.max(...all.slice(0,10).map(u=>u.drop_hi)) - t0) / DAY);
  days = Math.min(Math.max(days, 3), 14);
  const t1 = t0 + days*DAY;
  const rows = all.filter(u => u.drop_lo < t1).slice(0, 10);
  const rest = all.length - rows.length;
  const pct = ts => Math.min(100, Math.max(0, (ts - t0) / (t1 - t0) * 100));
  const step = days > 8 ? 2 : 1;
  const ticks = [];
  for (let i = 0; i < days; i += step){
    const d = new Date((t0 + i*DAY)*1000);
    ticks.push(`<span style="left:${pct(t0+i*DAY)}%">${d.toLocaleDateString(loc(),{weekday:'short', day:'numeric'})}</span>`);
  }
  const nowX = pct(n);
  const dayW = `${100/days}%`;
  el.innerHTML = `<div class="tl num">
    <div class="tl-row tl-axis"><div></div><div class="tl-track">${ticks.join('')}</div><div></div></div>
    ${rows.map(u => {
      const t = byName.get(u.name), x = t && CONF.has(t.id), open = u.drop_lo <= n;
      const l = pct(u.drop_lo), w = Math.max(pct(u.drop_hi) - l, 0.6);
      const title = `${u.name}: ${fmtShort(u.drop_lo)} – ${fmtShort(u.drop_hi)}`;
      const bar = t
        ? `<a class="tl-bar q ${x?'x':''}" href="#snipes" style="left:${l}%;width:${w}%" title="${esc(title)}" aria-label="${esc(title)}"></a>`
        : `<button class="tl-bar" data-plan="${esc(u.name)}" style="left:${l}%;width:${w}%" title="${esc(title)}" aria-label="Snipe ${esc(title)}"></button>`;
      const act = x ? `<span class="pill c-red">${tr('conflict_short')}</span>`
        : t ? `<span class="pill c-dia">${tr('planned')}</span>`
        : `<button class="btn small" data-plan="${esc(u.name)}">Snipe</button>`;
      return `<div class="tl-row">
        <div class="n">${u.star ? '<span class="st">★</span>' : ''}${esc(u.name)}<small>${open ? tr('win_open') : `<span data-t="${u.drop_lo}"></span>`}</small></div>
        <div class="tl-track" style="--day:${dayW}"><i class="tl-now" style="left:${nowX}%"></i>${bar}</div>
        <div class="tl-act">${act}</div>
      </div>`; }).join('')}
    ${rest > 0 ? `<div class="tl-more">${tr('dr_more',{n:rest})} <a href="#names" data-filter="released">${tr('dr_more_link')}</a></div>` : ''}
  </div>`;
}

const openAtt = new Set();
const fmtOff = ms => `${ms >= 0 ? '+' : '−'}${Math.abs(Math.round(ms))} ms`;
function attRow(t){
  const drop = t.mode === 'drop';

    const cls = a.status === 200 ? 'c-green' : a.status ? '' : 'c-red';
    return `<tr><td>${a.idx}</td><td>${sent}</td>${drop ? `<td>${fmtOff((a.sent - t.drop_at) * 1000 + a.ms / 2)}</td>` : ''}<td class="${cls}">${a.status || '–'}</td><td>${Math.round(a.ms)} ms</td><td class="body" title="${esc(a.body)}">${esc(a.body)}</td></tr>`;

  return `<tr class="att-row"><td colspan="7"><table class="att num"><thead><tr><th>#</th><th>${tr(drop ? 'att_rel' : 'att_sent')}</th>${drop ? `<th>${tr('att_arr')}</th>` : ''}<th>Status</th><th>${tr('att_ms')}</th><th>${tr('att_body')}</th></tr></thead><tbody>${rows}</tbody></table>${drop ? `<p class="hint">${tr('att_hint')}</p>` : ''}</td></tr>`;
}

    <td class="num">${when}</td>

    <td class="acts">${attBtn}${t.status==='queued'?`<button class="btn small ghost" data-casing="${t.id}" data-name="${esc(t.name)}" data-cur="${esc(t.claim_as || '')}">${tr('casing_btn')}</button>`:''}${live(t)?`<button class="btn small danger" data-cancel="${t.id}">${tr('cancel')}</button>`:''}</td>
  </tr>${n && openAtt.has(t.id) ? attRow(t) : ''}`;

const snipeHead = () => `<thead><tr><th>${tr('th_name')}</th><th>${tr('th_status')}</th><th>${tr('th_method')}</th><th>${tr('th_when')}</th><th>${tr('account')}</th><th>Token</th><th></th></tr></thead>`;

        <td>${a.has_profile ? esc(a.profile_name) : a.has_profile===0 ? `<span class="c-green">${tr('ac_noprof')}</span>` : `<span class="muted">${tr('st_unknown')}</span>`}</td>

      </tr>`; }).join('')}</tbody></table></div>`;

function tick(){
  if(!S) return;
  const n = now();
  $$('[data-t]').forEach(el => el.textContent = dur(+el.dataset.t - n));
  $$('[data-t-start]').forEach(el => el.textContent = tr('start_in',{t:dur(+el.dataset.tStart - n)}));
  $$('[data-t-exp]').forEach(el => el.textContent = tr('ac_expires',{t:dur(+el.dataset.tExp - n)}));
  $$('[data-clock]').forEach(el => el.innerHTML = clockHTML(+el.dataset.clock - n));
  $$('[data-xp]').forEach(el => {
    const [a, b] = el.dataset.xp.split(',').map(Number);
    const p = b > a ? (n - a) / (b - a) : 1;
    el.style.width = `${Math.min(100, Math.max(0, p*100)).toFixed(2)}%`;
  });
  // countdown in the tab title
  if (nextAt){
    const {d,h,m,s} = parts(nextAt - n), pad = v => String(v).padStart(2,'0');
    document.title = `${d ? d+'d ' : ''}${pad(h)}:${pad(m)}:${pad(s)} · ${nextName}`;
  } else document.title = 'namesniper';
}

/* ---------- snipe dialog ---------- */
const sd = $('#snipe-dlg'), sf = $('#snipe-form');
let sdDrop = null, sdName = '';
function openSnipe(name=''){
  if (!S) return;
  sf.reset();
  sf.name.value = name; sdName = name;
  $('#f-account').innerHTML = accountOptions(null);
  sdDrop = S.upcoming.find(u => u.name === name.toLowerCase()) || null;
  sf.mode.value = sdDrop ? 'window' : 'drop';
  syncSnipe();
  sd.showModal();
  (name ? sf.account_id : sf.name).focus();
}
function syncSnipe(){
  $('#snipe-title').textContent = sdName ? tr('sd_title',{name:sdName}) : tr('new_snipe');
  const n = sf.name.value.trim().toLowerCase();
  const found = S.upcoming.find(u => u.name === n) || null;
  if (found && found !== sdDrop && sf.mode.value === 'drop' && !sf.drop_at.value) sf.mode.value = 'window';
  sdDrop = found;
  const dup = S.targets.find(t => live(t) && t.name === n);
  const winOpt = sf.mode.querySelector('[value=window]');
  winOpt.disabled = !sdDrop;
  if (!sdDrop && sf.mode.value === 'window') sf.mode.value = 'drop';
  const m = sf.mode.value;
  $('#f-window').hidden = m !== 'window';
  $('#f-drop').hidden = m !== 'drop'; sf.drop_at.required = m === 'drop';
  $('#f-hours').hidden = m !== 'watch';
  if (sdDrop) $('#f-window').innerHTML = tr('sd_window',{lo:fmt(sdDrop.drop_lo), hi:fmt(sdDrop.drop_hi), min:S.settings.window_before_min});
  $('#f-hint').textContent = tr({window:'sd_h_window', drop:'sd_h_drop', watch:'sd_h_watch'}[m]) + (dup ? tr('sd_dup') : '');
}
sf.name.addEventListener('input', syncSnipe);
sf.mode.addEventListener('change', syncSnipe);
$('#snipe-check').addEventListener('click', () => checkName(sf.name.value.trim()));
sd.addEventListener('close', async () => {
  if (sd.returnValue !== 'save') return;
  const name = sf.name.value.trim(), m = sf.mode.value;
  const account_id = sf.account_id.value ? +sf.account_id.value : null;
  try{
    if (m === 'window') await api(`/api/names/${encodeURIComponent(name)}/snipe`, {method:'POST', body: JSON.stringify({account_id})});
    else {
      const body = {name, mode: m, hours: +sf.hours.value || 24, account_id};
      if (m === 'drop') body.drop_at = new Date(sf.drop_at.value).toISOString();
      await api('/api/targets', {method:'POST', body: JSON.stringify(body)});
    }
    toast(tr('t_planned',{name})); refresh();
  }catch{}
});

async function checkName(n){
  if (!n) { toast(tr('t_need_name'), true); return; }
  try{
    const r = await api(`/api/check/${encodeURIComponent(n)}`, {method:'POST'});
    const k = 'chk_' + r.status;
    toast(`${n} ${STR[k] ? tr(k) : r.status}`);
  }catch{}
}

/* ---------- clicks ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, a'); if(!el) return;
  const d = el.dataset;
  if ('closeAcc' in d) { ad.close(); return; }
  if ('import' in d) { openImport(); return; }
  if (d.helper) {
    try { await api(`/api/accounts/${d.helper}/helper`, {method:'PUT', body: JSON.stringify({locked: d.to==='1'})}); refresh(); } catch {}
    return;
  }
  if (d.casing) {
    const v = prompt(tr('casing_prompt',{name:d.name, up:d.name.toUpperCase()}), d.cur || d.name);
    if (v === null) return;
    try { await api(`/api/targets/${d.casing}/casing`, {method:'PUT', body: JSON.stringify({claim_as: v.trim()})});
          toast(tr('t_casing',{name:d.name, as:v.trim() || d.name})); refresh(); } catch {}
    return;
  }
  if ('newSnipe' in d) { openSnipe(); return; }
  if (d.plan) { openSnipe(d.plan); return; }
  if (d.filter !== undefined && el.tagName === 'A') { e.preventDefault(); setFilter(d.filter); return; }
  if (d.chk) { checkName(d.chk); return; }
  if (d.token) { e.preventDefault(); openAccount(+d.token); return; }
  if (d.link) { openAccount(+d.link, 'msa'); return; }
  if (d.att) { const id = +d.att; openAtt.has(id) ? openAtt.delete(id) : openAtt.add(id); renderSnipes(S.targets.filter(live)); return; }
  if ('ntp' in d) {
    e.preventDefault();
    try { const r = await api('/api/ntp', {method:'POST'}); toast(tr(r.ok ? 't_ntp_ok' : 't_ntp_bad'), !r.ok); refresh(); } catch {}
    return;
  }
  if (d.probe) {
    const id = +d.probe; probing.add(id); renderAccounts();
    try {
      const r = await api(`/api/accounts/${id}/probe`, {method:'POST'});
      const v = {codes: r.codes.join('/'), ms: r.ms_min == null ? '–' : Math.round(r.ms_min)};
      toast(tr(r.ok ? 't_probe_ok' : 't_probe_bad', v), !r.ok);
    } catch {}
    probing.delete(id); refresh();
    return;
  }
  if (d.star) {
    try { await api(`/api/names/${encodeURIComponent(d.star)}/star`, {method:'PUT', body: JSON.stringify({star: d.on === '1'})}); loadNames(); refresh(); } catch {}
    return;
  }
  try{
    if (d.lock){ await api(`/api/accounts/${d.lock}/lock`, {method:'PUT', body: JSON.stringify({locked: d.to==='1'})}); toast(tr(d.to==='1' ? 't_lock_on' : 't_lock_off')); }
    else if (d.refresh){ await api(`/api/accounts/${d.refresh}/refresh`, {method:'POST'}); toast(tr('t_tok_new')); }
    else if (d.cancel){ if(!confirm(tr('c_cancel'))) return; await api(`/api/targets/${d.cancel}`, {method:'DELETE'}); toast(tr('t_cancelled')); }
    else if (d.check){ await api(`/api/accounts/${d.check}/check`, {method:'POST'}); toast(tr('t_checked')); }
    else if (d.del){ if(!confirm(tr('c_del'))) return; await api(`/api/accounts/${d.del}`, {method:'DELETE'}); toast(tr('t_deleted')); }
    else return;
    refresh();
  }catch{}
});
document.addEventListener('change', async e => {
  const sel = e.target.closest('select[data-pin]'); if(!sel) return;
  try{
    await api(`/api/targets/${sel.dataset.pin}`, {method:'PATCH', body: JSON.stringify({account_id: sel.value ? +sel.value : null})});
    toast(sel.value ? tr('t_pin',{label:accLabel(+sel.value)}) : tr('t_pin_auto'));
    sel.blur(); refresh();
  }catch{ refresh(); }
});

/* ---------- names ---------- */
const NST = {taken:['nm_taken','c-muted'], free:['nm_free','c-dia'], released:['nm_released','c-gold']};
let nState='released', nKind='', nQ='', nOff=0, nTotal=0; const NLIM=100;
function setFilter(st){
  nState = st; nOff = 0;
  $$('#state-seg button').forEach(x=>x.classList.toggle('on', x.dataset.state===st));
  if (location.hash !== '#names') location.hash = '#names'; else loadNames();
}
async function loadNames(){
  if ($('[data-page=names]').hidden) return;
  try{
    const r = await api(`/api/names?state=${nState}&kind=${nKind}&q=${encodeURIComponent(nQ)}&limit=${NLIM}&offset=${nOff}`);
    nTotal = r.total;
    const queued = new Set((S?.targets||[]).filter(live).map(t=>t.name));
    $('#names').innerHTML = r.rows.length ? r.rows.map(x => `<tr>
      <td class="n"><button class="star ${x.star?'on':''}" data-star="${esc(x.name)}" data-on="${x.star?0:1}" aria-pressed="${!!x.star}" title="${tr(x.star?'star_rm':'star_add')}" aria-label="${tr(x.star?'star_rm':'star_add')}">★</button>${esc(x.name)}</td>
      <td><span class="pill ${NST[x.state]?.[1]||''}">${NST[x.state] ? tr(NST[x.state][0]) : esc(x.state)}</span>${x.star && x.state==='taken' && S?.settings.fast_enabled ? `<span class="sub c-gold">${tr('nm_fast')}</span>` : ''}</td>
      <td>${x.drop_lo ? `${fmtShort(x.drop_lo)} – ${fmtShort(x.drop_hi)}` : '<span class="muted">–</span>'}</td>
      <td class="muted">${x.checked_at ? fmtShort(x.checked_at) : ''}</td>
      <td class="acts"><button class="btn small" data-chk="${esc(x.name)}">${tr('check')}</button>${queued.has(x.name) ? `<span class="pill c-dia" style="margin-left:10px">${tr('planned')}</span>` : `<button class="btn small" data-plan="${esc(x.name)}">Snipe</button>`}</td>
    </tr>`).join('') : `<tr><td colspan="5" class="muted" style="padding:22px 14px">${nKind==='starred' ? tr('nm_empty_star') : nState==='released' ? tr('nm_empty_rel') : tr('nm_empty')}</td></tr>`;
    $('#names-info').textContent = nTotal ? tr('range',{a:fmtN(nOff+1), b:fmtN(Math.min(nOff+NLIM,nTotal)), n:fmtN(nTotal)}) : '';
    $('#prev').disabled = nOff===0; $('#next-page').disabled = nOff+NLIM>=nTotal;
  }catch{}
}
$('#state-seg').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setFilter(b.dataset.state); });
$('#kind-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  nKind = b.dataset.kind; nOff = 0;
  $$('#kind-seg button').forEach(x => x.classList.toggle('on', x === b));
  loadNames();
});
let qT; $('#name-q').addEventListener('input', e => { clearTimeout(qT); qT=setTimeout(()=>{ nQ=e.target.value.trim(); nOff=0; loadNames(); },250); });
$('#prev').addEventListener('click', ()=>{ nOff=Math.max(0,nOff-NLIM); loadNames(); });
$('#next-page').addEventListener('click', ()=>{ nOff+=NLIM; loadNames(); });
setInterval(loadNames, 15000);

/* ---------- import ---------- */
const UNIT = {s:1, m:60, u:3600, h:3600, d:86400};
function parseNameMC(text){
  const re = /([A-Za-z0-9_]{3,16})\s+(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})\s*•?\s*(\d{1,2}):(\d{2}):(\d{2})\s*±\s*([\d.,]+)\s*([smuhd])/g;
  const out = []; let m;
  while((m = re.exec(text))){
    const [, name, d, mo, y, h, mi, se, v, u] = m;
    out.push({name, drop_at: new Date(+y, +mo-1, +d, +h, +mi, +se).getTime()/1000, unc: parseFloat(v.replace(',','.'))*UNIT[u]});
  }
  return out;
}
const idl = $('#import-dlg'), ifm = $('#import-form');
function importPreview(){
  const items = parseNameMC(ifm.text.value), exact = items.filter(i=>i.unc<=1).length;
  $('#import-preview').textContent = items.length ? tr('im_found',{n:items.length, e:exact, w:items.length-exact}) : tr('im_none');
}
function openImport(){ ifm.reset(); importPreview(); idl.showModal(); }
$('#open-import').addEventListener('click', openImport);
$('#calib-apply').addEventListener('click', async () => {
  try { const r = await api('/api/calibration/apply', {method:'POST'}); toast(tr('t_calib',{s:sgn(r.hold_offset_s)})); await refresh(); fillSettings(); } catch {}
});
ifm.text.addEventListener('input', importPreview);
idl.addEventListener('close', async ()=>{
  if(idl.returnValue!=='save') return;
  const items = parseNameMC(ifm.text.value); if(!items.length){ toast(tr('t_im_none'), true); return; }
  try{
    const r = await api('/api/import', {method:'POST', body: JSON.stringify(items)});
    toast(tr('t_im_done',{n:r.added.length}) + (r.skipped.length ? tr('t_im_skip',{n:r.skipped.length}) : ''));
    if(r.skipped.length) console.log('Skipped:', r.skipped);
    refresh(); setFilter('released');
  }catch{}
});

/* ---------- accounts ---------- */
const ad = $('#account-dlg'), af = $('#account-form');
let editAccount = null, accMode = 'msa', flow = null, flowTimer = null;
function accLead(){
  const label = editAccount ? esc(accLabel(editAccount)) : '';
  $('#account-lead').innerHTML = accMode === 'msa'
    ? (editAccount ? tr('ad_lead_link',{label}) : tr('ad_lead_msa'))
    : (editAccount ? tr('ad_lead_edit') : tr('ad_lead_new'));
}
function setAccMode(m){
  accMode = m;
  $$('#acc-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#msa-box').hidden = m !== 'msa';
  $('#msa-start').hidden = m !== 'msa' || !!flow;
  $('#msa-start').disabled = !S?.msa_ready;
  $('#msa-hint').innerHTML = S?.msa_ready ? tr('ad_msa_hint') : tr('ad_msa_setup');
  $('#token-wrap').hidden = m !== 'paste';
  af.token.required = m === 'paste';
  $('#acc-save').hidden = m !== 'paste';
  accLead();
}
function stopFlow(cancel=true){
  clearInterval(flowTimer); flowTimer = null;
  if (cancel && flow) fetch(`/api/msa/${flow.id}`, {method:'DELETE'}).catch(() => {});
  flow = null;
  $('#msa-code').hidden = true;
  $('#msa-status').textContent = ''; $('#msa-status').className = 'muted';
}
function openAccount(id=null, mode=null){
  stopFlow();
  editAccount = id; af.reset();
  $('#account-title').textContent = id ? tr('ad_title_edit',{label:accLabel(id)}) : tr('ad_title_new');
  $('#label-wrap').hidden = !!id;
  $('#lock-wrap').hidden = !!id;
  setAccMode(mode || (S?.msa_ready ? 'msa' : 'paste'));
  ad.showModal();
}
async function pollFlow(){
  if (!flow) return;
  let f;
  try { const r = await fetch(`/api/msa/${flow.id}`); if (!r.ok) throw 0; f = await r.json(); }
  catch { stopFlow(false); setAccMode(accMode); return; }
  if (f.status === 'done'){
    stopFlow(false); ad.close('linked'); toast(tr('t_msa_done')); refresh();
  } else if (f.status === 'error' || f.status === 'cancelled'){
    clearInterval(flowTimer); flowTimer = null; flow = null;
    $('#msa-status').textContent = f.msg || ''; $('#msa-status').className = 'c-red';
    $('#msa-start').hidden = false;
  } else {
    $('#msa-status').textContent = tr('ad_msa_wait',{t:dur(f.expires - Date.now()/1000)});
  }
}
$('#acc-mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !flow) setAccMode(b.dataset.mode); });
$('#msa-start').addEventListener('click', async () => {
  const url = editAccount ? `/api/accounts/${editAccount}/msa` : '/api/accounts/msa';
  const body = editAccount ? {} : {label: af.label.value, locked: af.locked.checked};
  try { flow = await api(url, {method:'POST', body: JSON.stringify(body)}); } catch { return; }
  $('#msa-start').hidden = true;
  $('#msa-code').hidden = false;
  $('#msa-user-code').textContent = flow.code;
  $('#msa-step').innerHTML = tr('ad_msa_step',{url: esc(flow.url)});
  $('#msa-status').className = 'muted';
  pollFlow();
  flowTimer = setInterval(pollFlow, 3000);
});
$('#msa-user-code').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#msa-user-code').textContent); toast(tr('t_copied')); } catch {}
});
$('#open-account').addEventListener('click', () => openAccount());
ad.addEventListener('close', async () => {
  if (ad.returnValue === 'linked') return;
  stopFlow();
  if (ad.returnValue !== 'save' || accMode !== 'paste') return;
  try{
    if(editAccount) await api(`/api/accounts/${editAccount}`, {method:'PUT', body: JSON.stringify({token: af.token.value})});
    else await api('/api/accounts', {method:'POST', body: JSON.stringify({label: af.label.value, token: af.token.value, locked: af.locked.checked})});
    toast(tr(editAccount ? 't_tok_new' : 't_acc_added')); refresh();
  }catch{}
});

/* ---------- settings ---------- */
const stf = $('#settings-form');
function fillSettings(){
  if(!S) return;
  for(const [k,v] of Object.entries(S.settings)){
    const el = stf.elements[k]; if(!el) continue;
    if(el.type === 'checkbox') el.checked = v; else el.value = v;
  }
  $('#settings-state').textContent = '';
}
stf.addEventListener('input', () => $('#settings-state').textContent = tr('st_dirty'));
async function saveSettings(){
  const body = {};
  for(const el of stf.elements){
    if(!el.name) continue;
    body[el.name] = el.type==='checkbox' ? el.checked : (el.type==='number' || el.name==='scan_length') ? +el.value : el.value;
  }
  await api('/api/settings', {method:'POST', body: JSON.stringify(body)});
  $('#settings-state').textContent = tr('st_saved'); refresh();
}
stf.addEventListener('submit', async e => {
  e.preventDefault();
  try{ await saveSettings(); toast(tr('t_saved')); }catch{}
});
$('#notify-test').addEventListener('click', async () => {
  try{ await saveSettings(); await api('/api/notify-test', {method:'POST'}); toast(tr('t_test_saved')); }catch{}
});

/* ---------- log ---------- */
const logFull = $('#log-full'), logMini = $('#log-mini');
const logBuf = [];
function logRow(e, mini){
  const r = document.createElement('div'); r.className = e.level;
  const ts = mini ? new Date(e.ts*1000).toLocaleTimeString(loc()) : fmtShort(e.ts);
  r.innerHTML = `<time>${ts}</time><span>${esc(e.msg)}</span>`; return r;
}
function addLog(e){
  logBuf.push(e); if (logBuf.length > 500) logBuf.shift();
  const atBottom = logFull.scrollHeight - logFull.scrollTop - logFull.clientHeight < 40;
  logFull.appendChild(logRow(e));
  while(logFull.children.length > 500) logFull.firstChild.remove();
  if(atBottom) logFull.scrollTop = logFull.scrollHeight;
  logMini.appendChild(logRow(e, true));
  while(logMini.children.length > 6) logMini.firstChild.remove();
}
function connect(){
  const es = new EventSource('/api/events');
  logBuf.length = 0; logFull.innerHTML = ''; logMini.innerHTML = '';
  es.onmessage = m => addLog(JSON.parse(m.data));
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}

applyI18n();
refresh().then(route);
connect();
</script>
</body>
